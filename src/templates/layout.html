<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-book-open"></i>
                <span>LIBRARY SYSTEM</span>
            </div>
            <nav>
                <a href="/dashboard" class="{{ 'active' if '/dashboard' in request.path}}">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="/books" class="{{ 'active' if '/books' in request.path }}">
                    <i class="fas fa-book"></i> Manage Books
                </a>
                <a href="/members" class="{{ 'active' if '/members' in request.path }}">
                    <i class="fas fa-users"></i> Manage Members
                </a>
                <a href="/borrowings" class="{{ 'active' if '/borrowings' in request.path }}">
                    <i class="fas fa-exchange-alt"></i> Borrowings
                </a>
            </nav>
        </div>
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
