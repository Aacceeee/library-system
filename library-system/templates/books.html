{% extends 'layout.html' %}
{% block content %}

<div class="page-header">
    <h1>Manage Books</h1>
    <a href="/add_book" class="btn-add">
        <i class="fas fa-plus"></i> Add Book
    </a>
</div>

<div class="table-card">
    <div class="table-card-header">
        <h2>Book List</h2>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Genre</th>
                <th>Quantity</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book[0] }}</td>
                <td>{{ book[1] }}</td>
                <td>{{ book[2] }}</td>
                <td>{{ book[3] }}</td>
                <td>{{ book[4] }}</td>
                <td>
                    <a href="/edit_book/{{ book[0] }}" class="btn-edit">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <a href="/delete_book/{{ book[0] }}" class="btn-delete"
                       onclick="return confirm('Are you sure you want to delete this book?')">
                        <i class="fas fa-trash"></i> Delete
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
