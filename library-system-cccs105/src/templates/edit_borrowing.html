{% extends 'layout.html' %}
{% block content %}

<a href="/borrowings" class="btn-back">
    <i class="fas fa-arrow-left"></i> Back to Borrowings
</a>

<div class="page-header">
    <h1>Edit Borrowing</h1>
</div>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label>Book</label>
            <select name="book_id">
                {% for book in books %}
                <option value="{{ book[0] }}" {% if book[0] == borrowing[1] %}selected{% endif %}>{{ book[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Member</label>
            <select name="member_id">
                {% for member in members %}
                <option value="{{ member[0] }}" {% if member[0] == borrowing[2] %}selected{% endif %}>{{ member[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Borrow Date</label>
            <input type="date" name="borrow_date" value="{{ borrowing[3] }}">
        </div>
        <div class="form-group">
            <label>Return Date</label>
            <input type="date" name="return_date" value="{{ borrowing[4] }}">
        </div>
        <button type="submit" class="btn-submit">
            <i class="fas fa-save"></i> Update Borrowing
        </button>
    </form>
</div>

{% endblock %}
