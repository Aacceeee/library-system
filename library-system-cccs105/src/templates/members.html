{% extends 'layout.html' %}
{% block content %}

<div class="page-header">
    <h1>Manage Members</h1>
    <a href="/add_member" class="btn-add">
        <i class="fas fa-plus"></i> Add Member
    </a>
</div>

<div class="table-card">
    <div class="table-card-header">
        <h2>Member List</h2>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search members..." onkeyup="searchTable()">
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            {% for member in members %}
            <tr>
                <td>{{ member[0] }}</td>
                <td>{{ member[1] }}</td>
                <td>{{ member[2] }}</td>
                <td>{{ member[3] }}</td>
                <td>
                    <a href="/edit_member/{{ member[0] }}" class="btn-edit">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <a href="/delete_member/{{ member[0] }}" class="btn-delete"
                       onclick="return confirm('Are you sure you want to delete this member?')">
                        <i class="fas fa-trash"></i> Delete
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <div id="noResults" style="display:none; text-align:center; padding: 40px; color: #999;">
        <i class="fas fa-search" style="font-size:40px; margin-bottom:12px; display:block;"></i>
        No members found matching your search.
    </div>
</div>

<script>
function searchTable() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const rows = document.querySelectorAll('#tableBody tr');
    let visibleCount = 0;
    rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        if (text.includes(input)) {
            row.style.display = '';
            visibleCount++;
        } else {
            row.style.display = 'none';
        }
    });
    document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
}
</script>

{% endblock %}
