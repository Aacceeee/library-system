{% extends 'layout.html' %}
{% block content %}

<a href="/members" class="btn-back">
    <i class="fas fa-arrow-left"></i> Back to Members
</a>

<div class="page-header">
    <h1>Edit Member</h1>
</div>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ member[1] }}">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="text" name="email" value="{{ member[2] }}">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" value="{{ member[3] }}">
        </div>
        <button type="submit" class="btn-submit">
            <i class="fas fa-save"></i> Update Member
        </button>
    </form>
</div>

{% endblock %}
