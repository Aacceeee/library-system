<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-book-open"></i>
                <span>LIBRARY SYSTEM</span>
            </div>
            <nav>
                <a href="/dashboard" class="{{ 'active' if '/dashboard' in request.path}}">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="/books" class="{{ 'active' if '/books' in request.path }}">
                    <i class="fas fa-book"></i> Manage Books
                </a>
                <a href="/members" class="{{ 'active' if '/members' in request.path }}">
                    <i class="fas fa-users"></i> Manage Members
                </a>
                <a href="/borrowings" class="{{ 'active' if '/borrowings' in request.path }}">
                    <i class="fas fa-exchange-alt"></i> Borrowings
                </a>
            </nav>
        </div>
        <div class="main-content">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash flash-{{ category }}">
                                <i class="fas fa-check-circle"></i>
                                <span>{{ message }}</span>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const flashMessages = document.querySelectorAll(".flash");
            flashMessages.forEach(function (message) {
                setTimeout(function () {
                    message.classList.add("flash-hide");
                    setTimeout(function () {
                        message.remove();
                    }, 300);
                }, 2500);
            });
        });
    </script>
</body>
</html>
