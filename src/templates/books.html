{% extends 'layout.html' %}
{% block content %}

<div class="page-header">
    <h1>Manage Books</h1>
    <a href="/add_book" class="btn-add">
        <i class="fas fa-plus"></i> Add Book
    </a>
</div>

<div class="table-card">
    <div class="table-card-header">
        <h2>Book List</h2>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search books..." onkeyup="searchBooks()">
        </div>
    </div>
    <table id="booksTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Genre</th>
                <th>Quantity</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="booksBody">
            {% for book in books %}
            <tr>
                <td>{{ book[0] }}</td>
                <td>{{ book[1] }}</td>
                <td>{{ book[2] }}</td>
                <td>{{ book[3] }}</td>
                <td>{{ book[4] }}</td>
                <td>
                    <a href="/edit_book/{{ book[0] }}" class="btn-edit">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                   <a href="#" class="btn-delete"
   onclick="confirmDelete('/delete_book/{{ book[0] }}')">
    <i class="fas fa-trash"></i> Delete
                  </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <div id="noResults" style="display:none; text-align:center; padding: 40px; color: #999;">
        <i class="fas fa-search" style="font-size:40px; margin-bottom:12px; display:block;"></i>
        No books found matching your search.
    </div>
</div>

<script>
function searchBooks() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const rows = document.querySelectorAll('#booksBody tr');
    let visibleCount = 0;

    rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        if (text.includes(input)) {
            row.style.display = '';
            visibleCount++;
        } else {
            row.style.display = 'none';
        }
    });

    document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
}
</script>

{% endblock %}
