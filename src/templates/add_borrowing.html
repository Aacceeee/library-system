{% extends 'layout.html' %}
{% block content %}

<a href="/borrowings" class="btn-back">
    <i class="fas fa-arrow-left"></i> Back to Borrowings
</a>

<div class="page-header">
    <h1>Add New Borrowing</h1>
</div>

<div class="form-card">
    {% if error %}
    <div style="background:#fdedec; color:#e74c3c; padding:10px 16px; border-radius:8px; margin-bottom:16px; font-size:13px;">
        <i class="fas fa-exclamation-circle"></i> {{ error }}
    </div>
    {% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Book</label>
            <select name="book_id">
                {% for book in books %}
                <option value="{{ book[0] }}">{{ book[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Member</label>
            <select name="member_id">
                {% for member in members %}
                <option value="{{ member[0] }}">{{ member[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Borrow Date</label>
            <input type="date" name="borrow_date">
        </div>
        <div class="form-group">
            <label>Return Date</label>
            <input type="date" name="return_date">
        </div>
        <button type="submit" class="btn-submit">
            <i class="fas fa-plus"></i> Add Borrowing
        </button>
    </form>
</div>

{% endblock %}
