{% extends 'layout.html' %}
{% block content %}

<a href="/books" class="btn-back">
    <i class="fas fa-arrow-left"></i> Back to Books
</a>

<div class="page-header">
    <h1>Add New Book</h1>
</div>

<div class="form-card form-card-large">
    {% if error %}
    <div style="background:#fdedec; color:#e74c3c; padding:10px 16px; border-radius:8px; margin-bottom:16px; font-size:13px;">
        <i class="fas fa-exclamation-circle"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        <div class="book-form-stack">
            <div class="field">
                <label>TITLE</label>
                <input type="text" name="title" placeholder="Enter book title" required>
            </div>

            <div class="field">
                <label>AUTHOR</label>
                <input type="text" name="author" placeholder="Enter author name" required>
            </div>

            <div class="field">
                <label>GENRE</label>
                <input type="text" name="genre" placeholder="Enter genre" required>
            </div>

            <div class="field">
                <label>QUANTITY</label>
                <input type="number" name="quantity" placeholder="Enter quantity" min="0" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit" style="transform: translateY(0);">
                <i class="fas fa-plus"></i> Add Book
            </button>
        </div>
    </form>
</div>

{% endblock %}
