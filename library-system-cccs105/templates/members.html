{% extends 'layout.html' %}
{% block content %}

<div class="page-header">
    <h1>Manage Members</h1>
    <a href="/add_member" class="btn-add">
        <i class="fas fa-plus"></i> Add Member
    </a>
</div>

<div class="table-card">
    <div class="table-card-header">
        <h2>Member List</h2>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for member in members %}
            <tr>
                <td>{{ member[0] }}</td>
                <td>{{ member[1] }}</td>
                <td>{{ member[2] }}</td>
                <td>{{ member[3] }}</td>
                <td>
                    <a href="/edit_member/{{ member[0] }}" class="btn-edit">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <a href="/delete_member/{{ member[0] }}" class="btn-delete"
                       onclick="return confirm('Are you sure you want to delete this member?')">
                        <i class="fas fa-trash"></i> Delete
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
