<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a2332 0%, #2c3e50 50%, #1a2332 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        .welcome-container {
            text-align: center;
            color: white;
            animation: fadeInUp 1.2s ease;
        }

        .welcome-icon {
            font-size: 80px;
            color: #3498db;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }

        .welcome-title {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .welcome-title span {
            color: #3498db;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #aab4c4;
            margin-bottom: 48px;
            letter-spacing: 2px;
        }

        .welcome-btn {
            background: #3498db;
            color: white;
            padding: 16px 48px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 8px 32px rgba(52,152,219,0.4);
            letter-spacing: 1px;
        }

        .welcome-btn:hover {
            background: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(52,152,219,0.6);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(52,152,219,0.4);
            border-radius: 50%;
            animation: float linear infinite;
        }

        .welcome-container {
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="welcome-container">
    <div class="welcome-icon">
        <i class="fas fa-book-open"></i>
    </div>
    <div class="welcome-title">
        LIBRARY <span>SYSTEM</span>
    </div>
    <div class="welcome-subtitle">
        INFORMATION MANAGEMENT • CCCS 105
    </div>
    <a href="/dashboard" class="welcome-btn">
        <i class="fas fa-arrow-right"></i> Enter System
    </a>
</div>

<script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = (Math.random() * 10 + 5) + 's';
        particle.style.animationDelay = (Math.random() * 5) + 's';
        particle.style.width = (Math.random() * 6 + 2) + 'px';
        particle.style.height = particle.style.width;
        container.appendChild(particle);
    }
</script>

</body>
</html>
